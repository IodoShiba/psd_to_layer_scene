[package]
name = "psd_layer_to_scene"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["godot-4-5"]
godot-4-5 = ["godot/api-4-5"]
godot-4-3 = ["godot/api-4-3"]
godot-4-2-2 = ["godot/api-4-2-2"]

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }
psd = "0.3.5"
image = "0.24.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libwebp-image = { version = "0.3.0", features = ["libwebp-0_6"] }
libwebp = { version = "0.1.2", features = ["0_6"] }

[patch.crates-io]
psd = { git = "https://github.com/IodoShiba/psd.git", branch = "fix-rgba-idx" }

[lib]
crate-type = ["cdylib"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
